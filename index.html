<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .habit-btn { transition: all 0.2s ease; }
    .habit-btn:hover { transform: scale(1.05); }
    .progress-ring { transition: stroke-dashoffset 0.5s ease; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app"></div>

  <script>
    // ============ STORAGE ============
    const STORAGE_KEYS = {
      USER: 'ltp_user',
      TASKS: 'ltp_tasks',
      HABITS: 'ltp_habits',
      HABIT_LOGS: 'ltp_habit_logs',
      DIET: 'ltp_diet',
      GOALS: 'ltp_goals'
    };

    const Storage = {
      get(key) {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
      },
      set(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      },
      getArray(key) {
        const data = this.get(key);
        return data || [];
      }
    };

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    // ============ STATE ============
    let currentPage = 'login';
    let user = Storage.get(STORAGE_KEYS.USER);
    let tasks = Storage.getArray(STORAGE_KEYS.TASKS);
    let habits = Storage.getArray(STORAGE_KEYS.HABITS);
    let habitLogs = Storage.getArray(STORAGE_KEYS.HABIT_LOGS);
    let dietEntries = Storage.getArray(STORAGE_KEYS.DIET);
    let goals = Storage.getArray(STORAGE_KEYS.GOALS);

    // ============ ROUTER ============
    function navigate(page) {
      currentPage = page;
      render();
    }

    // ============ RENDER ============
    function render() {
      const app = document.getElementById('app');
      if (!user && currentPage !== 'login') {
        currentPage = 'login';
      }

      switch(currentPage) {
        case 'login': app.innerHTML = renderLogin(); break;
        case 'dashboard': app.innerHTML = renderDashboard(); break;
        case 'tasks': app.innerHTML = renderTasks(); break;
        case 'habits': app.innerHTML = renderHabits(); break;
        case 'diet': app.innerHTML = renderDiet(); break;
        case 'goals': app.innerHTML = renderGoals(); break;
        default: app.innerHTML = renderDashboard();
      }
      attachEventListeners();
    }

    // ============ LOGIN PAGE ============
    function renderLogin() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
            <div class="text-center mb-8">
              <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">📊</span>
              </div>
              <h1 class="text-3xl font-bold text-gray-900 mb-2">Life Tracker Pro</h1>
              <p class="text-gray-600">Track your tasks, habits, diet & goals</p>
            </div>
            <form id="loginForm" class="space-y-5">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <div class="relative">
                  <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                  <input type="email" id="loginEmail" required
                    class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="you@example.com">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <div class="relative">
                  <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                  <input type="password" id="loginPassword" required minlength="6"
                    class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Min 6 characters">
                  <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>
              <div id="loginError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg"></div>
              <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition shadow-lg shadow-blue-500/25">
                Sign In
              </button>
            </form>
            <div class="mt-6 text-center">
              <p class="text-gray-600">Don't have an account?
                <button id="showRegister" class="text-blue-600 hover:text-blue-700 font-semibold">Sign Up</button>
              </p>
            </div>
            <div id="registerForm" class="hidden mt-6 pt-6 border-t border-gray-200 space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <div class="relative">
                  <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                  <input type="text" id="registerName" required
                    class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="John Doe">
                </div>
              </div>
              <button type="button" id="showLogin"
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-lg transition">
                Back to Login
              </button>
              <button type="button" id="registerBtn"
                class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-semibold py-3 px-4 rounded-lg transition shadow-lg shadow-green-500/25">
                Create Account
              </button>
            </div>
            <div class="mt-6 pt-6 border-t border-gray-200">
              <button id="guestLogin"
                class="block w-full text-center text-gray-500 hover:text-gray-700 text-sm py-2 px-4 rounded-lg hover:bg-gray-50 transition">
                Continue as Guest (Demo)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ============ DASHBOARD ============
    function renderDashboard() {
      const today = getToday();
      const todayTasks = tasks.filter(t => t.dueDate === today || !t.dueDate);
      const completedTasks = todayTasks.filter(t => t.completed).length;
      const todayHabitsDone = habitLogs.filter(l => l.date === today).length;
      const todayDiet = dietEntries.filter(e => e.date === today);
      const totalCalories = todayDiet.reduce((sum, e) => sum + (e.calories || 0), 0);
      const totalWater = todayDiet.reduce((sum, e) => sum + (e.water || 0), 0);

      return `
        <div class="min-h-screen bg-gray-50">
          <!-- Header -->
          <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center">
                    <span class="text-xl">📊</span>
                  </div>
                  <div>
                    <h1 class="text-xl font-bold text-gray-900">Life Tracker</h1>
                    <p class="text-sm text-gray-500">Welcome, ${user?.name || 'Guest'}!</p>
                  </div>
                </div>
                <div class="flex items-center gap-4">
                  <div class="text-sm text-gray-500 hidden sm:block">
                    ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}
                  </div>
                  <button id="logoutBtn"
                    class="flex items-center gap-2 px-4 py-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                  </button>
                </div>
              </div>
            </div>
          </header>

          <!-- Main Content -->
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              ${renderStatCard('fa-check-circle', 'Tasks Today', `${completedTasks}/${todayTasks.length}`, 'blue')}
              ${renderStatCard('fa-trophy', 'Habits Done', `${todayHabitsDone}/${habits.length}`, 'green')}
              ${renderStatCard('fa-tint', 'Water', `${totalWater}/8 glasses`, 'cyan')}
              ${renderStatCard('fa-fire', 'Calories', `${totalCalories}/2000`, 'orange')}
            </div>

            <!-- Navigation -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <button onclick="navigate('tasks')"
                class="bg-blue-50 hover:bg-blue-100 rounded-xl p-4 transition text-blue-600">
                <i class="fas fa-tasks text-2xl mb-2"></i>
                <h3 class="font-semibold text-gray-900">Tasks</h3>
                <p class="text-sm text-gray-600">Manage tasks</p>
              </button>
              <button onclick="navigate('habits')"
                class="bg-green-50 hover:bg-green-100 rounded-xl p-4 transition text-green-600">
                <i class="fas fa-star text-2xl mb-2"></i>
                <h3 class="font-semibold text-gray-900">Habits</h3>
                <p class="text-sm text-gray-600">Track habits</p>
              </button>
              <button onclick="navigate('diet')"
                class="bg-purple-50 hover:bg-purple-100 rounded-xl p-4 transition text-purple-600">
                <i class="fas fa-utensils text-2xl mb-2"></i>
                <h3 class="font-semibold text-gray-900">Diet</h3>
                <p class="text-sm text-gray-600">Log meals</p>
              </button>
              <button onclick="navigate('goals')"
                class="bg-orange-50 hover:bg-orange-100 rounded-xl p-4 transition text-orange-600">
                <i class="fas fa-bullseye text-2xl mb-2"></i>
                <h3 class="font-semibold text-gray-900">Goals</h3>
                <p class="text-sm text-gray-600">Track goals</p>
              </button>
            </div>

            <!-- Today's Tasks & Habits -->
            <div class="grid lg:grid-cols-2 gap-6">
              <!-- Tasks -->
              <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-lg font-semibold text-gray-900">Today's Tasks</h2>
                  <button onclick="navigate('tasks')" class="text-blue-600 hover:text-blue-700 text-sm font-medium">View All →</button>
                </div>
                ${todayTasks.length > 0 ? todayTasks.slice(0, 5).map(task => `
                  <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg mb-2">
                    <button onclick="toggleTask('${task.id}')"
                      class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${task.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-blue-500'}">
                      ${task.completed ? '<i class="fas fa-check text-xs"></i>' : ''}
                    </button>
                    <div class="flex-1">
                      <p class="text-gray-900 ${task.completed ? 'line-through text-gray-500' : ''}">${task.title}</p>
                    </div>
                    <span class="text-xs px-2 py-1 rounded-full ${task.priority === 'high' ? 'bg-red-100 text-red-700' : task.priority === 'medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'}">
                      ${task.priority}
                    </span>
                  </div>
                `).join('') : `
                  <div class="text-center py-8">
                    <i class="fas fa-inbox text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">No tasks for today</p>
                  </div>
                `}
              </div>

              <!-- Habits -->
              <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-lg font-semibold text-gray-900">Today's Habits</h2>
                  <button onclick="navigate('habits')" class="text-blue-600 hover:text-blue-700 text-sm font-medium">View All →</button>
                </div>
                ${habits.length > 0 ? habits.map(habit => {
                  const isDone = habitLogs.some(l => l.habitId === habit.id && l.date === today);
                  return `
                    <div class="flex items-center gap-3 p-3 rounded-lg mb-2 ${isDone ? 'bg-green-50' : 'bg-gray-50'}">
                      <button onclick="toggleHabit('${habit.id}')"
                        class="w-10 h-10 rounded-full flex items-center justify-center text-xl habit-btn ${isDone ? '' : 'border-2'}"
                        style="background-color: ${isDone ? habit.color : 'white'}; border-color: ${habit.color}; color: ${isDone ? 'white' : 'inherit'}">
                        ${habit.emoji}
                      </button>
                      <div class="flex-1">
                        <p class="text-gray-900 ${isDone ? 'line-through text-gray-500' : ''}">${habit.name}</p>
                      </div>
                      ${isDone ? '<i class="fas fa-check-circle text-green-500"></i>' : ''}
                    </div>
                  `;
                }).join('') : `
                  <div class="text-center py-8">
                    <i class="fas fa-star text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">No habits tracked yet</p>
                  </div>
                `}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    function renderStatCard(icon, label, value, color) {
      const colors = {
        blue: 'bg-blue-100 text-blue-600',
        green: 'bg-green-100 text-green-600',
        orange: 'bg-orange-100 text-orange-600',
        cyan: 'bg-cyan-100 text-cyan-600'
      };
      return `
        <div class="bg-white rounded-xl shadow-sm p-6">
          <div class="w-12 h-12 rounded-lg ${colors[color]} flex items-center justify-center mb-4">
            <i class="fas ${icon} text-xl"></i>
          </div>
          <p class="text-2xl font-bold text-gray-900">${value}</p>
          <p class="text-sm text-gray-500 mt-1">${label}</p>
        </div>
      `;
    }

    // ============ TASKS PAGE ============
    function renderTasks() {
      const incompleteTasks = tasks.filter(t => !t.completed);
      const completedTasks = tasks.filter(t => t.completed);

      return `
        <div class="min-h-screen bg-gray-50">
          <header class="bg-white shadow-sm">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <button onclick="navigate('dashboard')" class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                  </button>
                  <div>
                    <h1 class="text-xl font-bold text-gray-900">Tasks</h1>
                    <p class="text-sm text-gray-500">Manage your tasks and to-dos</p>
                  </div>
                </div>
                <button onclick="showTaskForm()"
                  class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                  <i class="fas fa-plus"></i> Add Task
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div id="taskForm" class="hidden bg-white rounded-xl shadow-sm p-6 mb-6">
              <h2 class="text-lg font-semibold text-gray-900 mb-4">Create New Task</h2>
              <form id="newTaskForm" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                  <input type="text" id="taskTitle" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter task title">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                  <textarea id="taskDesc" rows="2"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Task description (optional)"></textarea>
                </div>
                <div class="grid grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    <select id="taskPriority"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                      <option value="low">Low</option>
                      <option value="medium" selected>Medium</option>
                      <option value="high">High</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <input type="text" id="taskCategory"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      placeholder="e.g., Work">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                    <input type="date" id="taskDueDate"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                  </div>
                </div>
                <div class="flex gap-3">
                  <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">Create Task</button>
                  <button type="button" onclick="hideTaskForm()"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition">Cancel</button>
                </div>
              </form>
            </div>

            <!-- Active Tasks -->
            <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
              <h2 class="text-lg font-semibold text-gray-900 mb-4">Active Tasks (${incompleteTasks.length})</h2>
              ${incompleteTasks.length > 0 ? incompleteTasks.map(task => `
                <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg mb-2">
                  <button onclick="toggleTask('${task.id}')"
                    class="w-6 h-6 rounded-full border-2 border-gray-300 hover:border-blue-500 flex items-center justify-center transition">
                  </button>
                  <div class="flex-1">
                    <p class="text-gray-900 font-medium">${task.title}</p>
                    ${task.description ? `<p class="text-gray-500 text-sm">${task.description}</p>` : ''}
                    <div class="flex items-center gap-3 mt-2">
                      <span class="text-xs px-2 py-1 rounded-full ${task.priority === 'high' ? 'bg-red-100 text-red-700' : task.priority === 'medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'}">${task.priority}</span>
                      ${task.category ? `<span class="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-700"><i class="fas fa-tag mr-1"></i>${task.category}</span>` : ''}
                      ${task.dueDate ? `<span class="text-xs text-gray-500"><i class="far fa-calendar mr-1"></i>${new Date(task.dueDate).toLocaleDateString()}</span>` : ''}
                    </div>
                  </div>
                  <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 transition p-2">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              `).join('') : '<p class="text-gray-500 text-center py-8">No active tasks. Create one above!</p>'}
            </div>

            <!-- Completed Tasks -->
            ${completedTasks.length > 0 ? `
              <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Completed (${completedTasks.length})</h2>
                ${completedTasks.map(task => `
                  <div class="flex items-center gap-4 p-4 bg-green-50 rounded-lg mb-2">
                    <button onclick="toggleTask('${task.id}')"
                      class="w-6 h-6 rounded-full bg-green-500 border-2 border-green-500 flex items-center justify-center text-white">
                      <i class="fas fa-check text-xs"></i>
                    </button>
                    <div class="flex-1">
                      <p class="text-gray-500 line-through">${task.title}</p>
                    </div>
                    <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 transition p-2">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </main>
        </div>
      `;
    }

    // ============ HABITS PAGE ============
    function renderHabits() {
      const today = getToday();

      return `
        <div class="min-h-screen bg-gray-50">
          <header class="bg-white shadow-sm">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <button onclick="navigate('dashboard')" class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                  </button>
                  <div>
                    <h1 class="text-xl font-bold text-gray-900">Habits</h1>
                    <p class="text-sm text-gray-500">Track your daily habits - ${habitLogs.filter(l => l.date === today).length}/${habits.length} done today</p>
                  </div>
                </div>
                <button onclick="showHabitForm()"
                  class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                  <i class="fas fa-plus"></i> Add Habit
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div id="habitForm" class="hidden bg-white rounded-xl shadow-sm p-6 mb-6">
              <h2 class="text-lg font-semibold text-gray-900 mb-4">Create New Habit</h2>
              <form id="newHabitForm" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Habit Name</label>
                  <input type="text" id="habitName" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500"
                    placeholder="e.g., Morning Exercise">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Choose Emoji</label>
                  <div class="flex flex-wrap gap-2" id="emojiOptions">
                    ${['💪','📚','🏃','💧','🧘','😴','🥗','✍️','🎯','🧠','🎨','🎵'].map(e => `
                      <button type="button" onclick="selectEmoji('${e}')"
                        class="w-10 h-10 text-xl rounded-lg bg-gray-100 hover:bg-gray-200 transition emoji-btn" data-emoji="${e}">${e}</button>
                    `).join('')}
                  </div>
                  <input type="hidden" id="habitEmoji" value="💪">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Choose Color</label>
                  <div class="flex flex-wrap gap-2" id="colorOptions">
                    ${['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'].map(c => `
                      <button type="button" onclick="selectColor('${c}')"

              <div class="flex items-center justify-between">

                  </button>
                  <div>
                    <h1 class="text-xl font-bold text-gray-900">Goals</h1>

                </div>
                <button onclick="showGoalForm()"

                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Current Value</label>
                    <input type="number" id="goalCurrent" min="0"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                      placeholder="0">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                    <input type="text" id="goalUnit"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"

              ${activeGoals.length > 0 ? activeGoals.map(goal => {
                const progress = Math.min((goal.currentValue / goal.targetValue) * 100, 100);
                const isOverdue = goal.deadline && new Date(goal.deadline) < new Date();
                return `
                  <div class="p-4 rounded-lg mb-4 ${isOverdue ? 'bg-red-50' : 'bg-gray-50'}">
                    <div class="flex items-start justify-between mb-3">
                      <div>
                        <p class="text-gray-900 font-medium">${goal.title}</p>
                        <p class="text-sm text-gray-500">${goal.currentValue} / ${goal.targetValue} ${goal.unit}</p>
                      </div>
                      ${goal.deadline ? `<span class="text-xs px-2 py-1 rounded-full ${isOverdue ? 'bg-red-100 text-red-700' : 'bg-gray-200 text-gray-600'}"><i class="far fa-calendar mr-1"></i>${new Date(goal.deadline).toLocaleDateString()}</span>` : ''}
                    </div>
                    <div class="mb-3">

              <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Completed (${completedGoals.length})</h2>
                ${completedGoals.map(goal => `
                  <div class="flex items-center gap-4 p-4 bg-green-50 rounded-lg mb-2">

                      <p class="text-sm text-gray-400">Achieved: ${goal.targetValue} ${goal.unit}</p>

    // ============ EVENT HANDLERS ============
    function attachEventListeners() {
      // Login
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;
          if (email && password.length >= 6) {
            user = { id: generateId(), email, name: email.split('@')[0] };
            Storage.set(STORAGE_KEYS.USER, user);
            navigate('dashboard');
          } else {
            document.getElementById('loginError').textContent = 'Invalid credentials';
            document.getElementById('loginError').classList.remove('hidden');
          }
        });
      }

      document.getElementById('showRegister')?.addEventListener('click', () => {
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
      });

      document.getElementById('showLogin')?.addEventListener('click', () => {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
      });

      document.getElementById('registerBtn')?.addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value;
        const name = document.getElementById('registerName').value;
        const password = document.getElementById('loginPassword').value;
        if (email && password.length >= 6 && name) {
          user = { id: generateId(), email, name };
          Storage.set(STORAGE_KEYS.USER, user);
          navigate('dashboard');
        }
      });

      document.getElementById('guestLogin')?.addEventListener('click', () => {
        user = { id: generateId(), email: 'guest@example.com', name: 'Guest User' };
        Storage.set(STORAGE_KEYS.USER, user);
        navigate('dashboard');
      });

      document.getElementById('togglePassword')?.addEventListener('click', () => {
        const input = document.getElementById('loginPassword');
        const icon = document.querySelector('#togglePassword i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fas fa-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'fas fa-eye';
        }
      });

      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        Storage.set(STORAGE_KEYS.USER, null);
        user = null;
        navigate('login');
      });

      // Task Form
      document.getElementById('newTaskForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const task = {
          id: generateId(),
          title: document.getElementById('taskTitle').value,
          description: document.getElementById('taskDesc').value,
          priority: document.getElementById('taskPriority').value,
          category: document.getElementById('taskCategory').value,
          dueDate: document.getElementById('taskDueDate').value,
          completed: false,
          createdAt: new Date().toISOString()
        };
        tasks.push(task);
        Storage.set(STORAGE_KEYS.TASKS, tasks);
        render();
      });

      // Habit Form
      document.getElementById('newHabitForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const habit = {
          id: generateId(),
          name: document.getElementById('habitName').value,
          emoji: document.getElementById('habitEmoji').value,
          color: document.getElementById('habitColor').value,
          createdAt: new Date().toISOString()
        };
        habits.push(habit);
        Storage.set(STORAGE_KEYS.HABITS, habits);
        render();
      });

      // Diet Form
      document.getElementById('newDietForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const entry = {
          id: generateId(),
          mealType: document.getElementById('mealType').value,
          foodName: document.getElementById('foodName').value,
          calories: parseInt(document.getElementById('foodCalories').value) || 0,
          protein: parseFloat(document.getElementById('foodProtein').value) || 0,
          carbs: parseFloat(document.getElementById('foodCarbs').value) || 0,
          fat: parseFloat(document.getElementById('foodFat').value) || 0,
          water: parseInt(document.getElementById('foodWater').value) || 0,
          date: getToday()
        };
        dietEntries.push(entry);
        Storage.set(STORAGE_KEYS.DIET, dietEntries);
        render();
      });

      // Goal Form
      document.getElementById('newGoalForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const goal = {
          id: generateId(),
          title: document.getElementById('goalTitle').value,
          targetValue: parseFloat(document.getElementById('goalTarget').value) || 0,
          currentValue: parseFloat(document.getElementById('goalCurrent').value) || 0,
          unit: document.getElementById('goalUnit').value,
          deadline: document.getElementById('goalDeadline').value,
          completed: false,
          createdAt: new Date().toISOString()
        };
        goals.push(goal);
        Storage.set(STORAGE_KEYS.GOALS, goals);
        render();
      });
    }

    // ============ ACTIONS ============
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        Storage.set(STORAGE_KEYS.TASKS, tasks);
        render();
      }
    }

    function deleteTask(id) {
      if (confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        Storage.set(STORAGE_KEYS.TASKS, tasks);
        render();
      }
    }

    function toggleHabit(id) {
      const today = getToday();
      const existingIndex = habitLogs.findIndex(l => l.habitId === id && l.date === today);
      if (existingIndex !== -1) {
        habitLogs.splice(existingIndex, 1);
      } else {
        habitLogs.push({ id: generateId(), habitId: id, date: today });
      }
      Storage.set(STORAGE_KEYS.HABIT_LOGS, habitLogs);
      render();
    }

    function deleteHabit(id) {
      if (confirm('Delete this habit?')) {
        habits = habits.filter(h => h.id !== id);
        Storage.set(STORAGE_KEYS.HABITS, habits);
        render();
      }
    }

    function deleteDietEntry(id) {
      if (confirm('Delete this entry?')) {
        dietEntries = dietEntries.filter(e => e.id !== id);
        Storage.set(STORAGE_KEYS.DIET, dietEntries);
        render();
      }
    }

    function deleteGoal(id) {
      if (confirm('Delete this goal?')) {
        goals = goals.filter(g => g.id !== id);
        Storage.set(STORAGE_KEYS.GOALS, goals);
        render();
      }
    }

    function completeGoal(id) {
      const goal = goals.find(g => g.id === id);
      if (goal) {
        goal.currentValue = goal.targetValue;
        goal.completed = true;
        Storage.set(STORAGE_KEYS.GOALS, goals);
        render();
      }
    }

    function updateGoalProgress(id, value) {
      const goal = goals.find(g => g.id === id);
      if (goal) {
        goal.currentValue = parseFloat(value) || 0;
        if (goal.currentValue >= goal.targetValue) {
          goal.completed = true;
        }
        Storage.set(STORAGE_KEYS.GOALS, goals);
        render();
      }
    }

    // ============ FORM TOGGLES ============
    function showTaskForm() {
      document.getElementById('taskForm').classList.remove('hidden');
    }
    function hideTaskForm() {
      document.getElementById('taskForm').classList.add('hidden');
    }
    function showHabitForm() {
      document.getElementById('habitForm').classList.remove('hidden');
    }
    function hideHabitForm() {
      document.getElementById('habitForm').classList.add('hidden');
    }
    function showDietForm() {
      document.getElementById('dietForm').classList.remove('hidden');
    }
    function hideDietForm() {
      document.getElementById('dietForm').classList.add('hidden');
    }
    function showGoalForm() {
      document.getElementById('goalForm').classList.remove('hidden');
    }
    function hideGoalForm() {
      document.getElementById('goalForm').classList.add('hidden');
    }

    function selectEmoji(emoji) {
      document.querySelectorAll('.emoji-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-green-500', 'bg-green-100'));
      document.querySelector(`[data-emoji="${emoji}"]`).classList.add('ring-2', 'ring-green-500', 'bg-green-100');
      document.getElementById('habitEmoji').value = emoji;
    }

    function selectColor(color) {
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-2', 'ring-gray-400'));
      document.querySelector(`[data-color="${color}"]`).classList.add('ring-2', 'ring-offset-2', 'ring-gray-400');
      document.getElementById('habitColor').value = color;
    }

    function selectMealType(type) {
      document.querySelectorAll('.meal-btn').forEach(btn => btn.classList.remove('border-purple-500', 'bg-purple-50'));
      document.querySelector(`[data-meal="${type}"]`).classList.add('border-purple-500', 'bg-purple-50');
      document.getElementById('mealType').value = type;
    }

    // ============ INIT ============
    render();
  </script>
</body>
</html>
